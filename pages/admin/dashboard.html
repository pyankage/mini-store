<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Dashboard Penjual</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <!-- Navbar Admin -->
  <header class="admin-navbar">
    <div class="admin-nav-left">
      <i class="fa-solid fa-store"></i>
      <span>Panel Penjual</span>
    </div>
    <div class="admin-nav-right">
      <a href="tambah-produk.html" class="btn-add">
        <i class="fa-solid fa-plus"></i> <span>Tambah Produk</span>
      </a>
      <button id="logoutBtn" class="btn-logout">
        <i class="fa-solid fa-sign-out-alt"></i> Keluar
      </button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-welcome">
      <h2>Daftar Produk Saya</h2>
      <p>Kelola produk jualanmu di sini</p>
    </div>

    <!-- Statistik singkat -->
    <div class="admin-stats">
      <div class="stat-card">
        <i class="fa-solid fa-box"></i>
        <span>Total Produk</span>
        <strong id="totalProducts">0</strong>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-tag"></i>
        <span>Total Kategori</span>
        <strong id="totalCategories">0</strong>
      </div>
    </div>

    <!-- Tabel Produk -->
    <div class="product-table-wrapper">
      <table class="product-table" id="productTable">
        <thead>
          <tr>
            <th>Gambar</th>
            <th>Nama</th>
            <th>Harga</th>
            <th>Kategori</th>
            <th>Tipe</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <!-- Diisi oleh JavaScript -->
        </tbody>
      </table>
      <p id="emptyMessage" style="display:none; text-align:center; padding:2rem; color:#64748b;">
        Belum ada produk. Klik "Tambah Produk" untuk mulai.
      </p>
    </div>
  </main>

  <script src="../../js/admin.js"></script>
</body>
</html>
