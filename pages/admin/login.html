<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Login Penjual</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <div class="admin-login-container">
    <div class="admin-login-box">
      <div class="login-icon">
        <i class="fa-solid fa-store"></i>
      </div>
      <h2>Panel Penjual</h2>
      <p class="login-subtitle">Masuk untuk mengelola produk</p>
      
      <form id="loginForm" class="admin-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Masukkan username" required>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Masukkan password" required>
          </div>
        </div>
        <button type="submit" class="btn-login">
          Masuk <i class="fa-solid fa-arrow-right"></i>
        </button>
        <p class="login-hint">Gunakan: admin / admin123</p>
      </form>
      <a href="../../index.html" class="back-to-store">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Toko
      </a>
    </div>
  </div>

  <script src="../../js/admin.js"></script>
</body>
</html>
