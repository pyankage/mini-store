<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Tambah Produk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <!-- Navbar Admin -->
  <header class="admin-navbar">
    <div class="admin-nav-left">
      <i class="fa-solid fa-store"></i>
      <span>Panel Penjual</span>
    </div>
    <div class="admin-nav-right">
      <a href="dashboard.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> <span>Kembali</span>
      </a>
      <button id="logoutBtn" class="btn-logout">
        <i class="fa-solid fa-sign-out-alt"></i> Keluar
      </button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-form-container">
      <h2>Tambah Produk Baru</h2>
      <form id="productForm" class="product-form">
        <div class="form-group">
          <label for="productName">Nama Produk</label>
          <input type="text" id="productName" placeholder="Contoh: Akun Mobile Legends" required>
        </div>
        <div class="form-group">
          <label for="productPrice">Harga (Rp)</label>
          <input type="number" id="productPrice" placeholder="Contoh: 150000" required min="0">
        </div>
        <div class="form-group">
          <label for="productGenre">Kategori</label>
          <select id="productGenre" required>
            <option value="akun">Akun</option>
            <option value="item">Item</option>
            <option value="joki">Jasa Joki</option>
          </select>
        </div>
        <div class="form-group">
          <label for="productType">Tipe</label>
          <select id="productType" required>
            <option value="instan">Instan</option>
            <option value="otomatis">Otomatis</option>
          </select>
        </div>
        <div class="form-group">
          <label for="productImage">URL Gambar Produk</label>
          <input type="url" id="productImage" placeholder="https://..." value="https://via.placeholder.com/400x225">
        </div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-plus"></i> Tambah Produk
        </button>
      </form>
    </div>
  </main>

  <script src="../../js/admin.js"></script>
</body>
</html>
