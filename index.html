<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Store • Beranda</title>

  <!-- Font Awesome untuk icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- CSS eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER UTAMA ===== -->
  <header class="store-header">
    <!-- Baris atas -->
    <div class="top-bar">
      <div class="left-group">
        <button class="menu-dots" id="menuDots" aria-label="Menu" title="Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="store-title">STORE</div>
      </div>
      <a href="pages/admin/login.html" class="login-btn" title="Masuk ke akun">
        <i class="fa-solid fa-user"></i> MASUK
      </a>
    </div>

    <!-- Pencarian (sticky) -->
    <div class="search-section">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari produk, kategori, atau brand..." aria-label="kolom pencarian">
      <button class="search-clear" id="clearBtn" aria-label="hapus pencarian" title="Bersihkan">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="search-btn" id="searchBtn" aria-label="tombol cari">
        <i class="fa-solid fa-arrow-right"></i> <span>Cari</span>
      </button>
    </div>

    <!-- Genre (4 kotak) -->
    <div class="genre-menu" id="genreMenu">
      <div class="genre-card active" data-genre="semua">
        <div class="genre-icon"><i class="fa-solid fa-border-all"></i></div>
        <div class="genre-label">SEMUA</div>
      </div>
      <div class="genre-card" data-genre="akun">
        <div class="genre-icon"><i class="fa-solid fa-user"></i></div>
        <div class="genre-label">AKUN</div>
      </div>
      <div class="genre-card" data-genre="item">
        <div class="genre-icon"><i class="fa-solid fa-box"></i></div>
        <div class="genre-label">ITEM</div>
      </div>
      <div class="genre-card" data-genre="joki">
        <div class="genre-icon"><i class="fa-solid fa-headset"></i></div>
        <div class="genre-label">JASA JOKI</div>
      </div>
    </div>

    <!-- Filter & Sorting -->
    <section class="filter-section">
      <div class="filter-row">
        <span class="filter-label">Urutkan:</span>
        <select id="sortSelect" class="sort-select">
          <option value="rekomendasi">Rekomendasi</option>
          <option value="termurah">Harga Termurah</option>
          <option value="termahal">Harga Termahal</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">Tipe:</span>
        <div class="filter-buttons" id="typeFilter">
          <button class="filter-btn active" data-type="semua">Semua</button>
          <button class="filter-btn" data-type="instan">Instan</button>
          <button class="filter-btn" data-type="manual">Manual</button>
        </div>
      </div>
    </section>

    <!-- Keterangan -->
    <div class="info-note">
      <i class="fa-solid fa-circle-info"></i> 
      <span>Gunakan filter untuk menyortir produk</span>
    </div>
  </header>

  <!-- ===== DRAWER (MENU SAMPING) ===== -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>Kategori</span>
      <button class="drawer-close" id="drawerClose" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-search">
      <i class="fa-solid fa-search"></i>
      <input type="text" id="drawerSearchInput" placeholder="Cari kategori...">
    </div>
    <div class="drawer-content" id="drawerContent">
      <button class="drawer-cat-btn" data-genre="semua">Semua</button>

      <div class="drawer-category-group" data-genre="akun">
        <div class="drawer-category-row">
          <button class="drawer-cat-btn main" data-genre="akun">Akun</button>
          <button class="drawer-toggle" data-target="akunSub"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="drawer-subcategory" id="akunSub" style="display:none;">
          <button class="drawer-sub-btn" data-sub="mobile-legends">Mobile Legends</button>
          <button class="drawer-sub-btn" data-sub="free-fire">Free Fire</button>
          <button class="drawer-sub-btn" data-sub="pubg">PUBG</button>
          <button class="drawer-sub-btn" data-sub="genshin">Genshin Impact</button>
        </div>
      </div>

      <div class="drawer-category-group" data-genre="item">
        <div class="drawer-category-row">
          <button class="drawer-cat-btn main" data-genre="item">Item</button>
          <button class="drawer-toggle" data-target="itemSub"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="drawer-subcategory" id="itemSub" style="display:none;">
          <button class="drawer-sub-btn" data-sub="skin">Skin</button>
          <button class="drawer-sub-btn" data-sub="senjata">Senjata</button>
          <button class="drawer-sub-btn" data-sub="item-rare">Item Rare</button>
        </div>
      </div>

      <div class="drawer-category-group" data-genre="joki">
        <div class="drawer-category-row">
          <button class="drawer-cat-btn main" data-genre="joki">Jasa Joki</button>
          <button class="drawer-toggle" data-target="jokiSub"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="drawer-subcategory" id="jokiSub" style="display:none;">
          <button class="drawer-sub-btn" data-sub="rank-push">Rank Push</button>
          <button class="drawer-sub-btn" data-sub="leveling">Leveling</button>
          <button class="drawer-sub-btn" data-sub="mabar">Mabar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== DAFTAR JUALAN (28 PRODUK) ===== -->
  <main class="product-list-section">
    <h2 class="section-title">Daftar Jualan</h2>
    <div class="product-grid" id="productGrid">
      <!-- Produk akan di-generate oleh JavaScript -->
    </div>

    <div class="show-all-wrapper">
      <a href="pages/semua-produk.html" class="show-all-btn">
        Tampilkan Semuanya <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
