<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>itemku · Home</title>
    <!-- Link ke file CSS terpisah -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="home-card">
        <!-- HEADER: itemku + Masuk -->
        <div class="navbar">
            <div class="brand">itemku<span>⏺</span></div>
            <div class="btn-masuk">Masuk</div>
        </div>

        <!-- SEARCH: Cari Game, Diamond, Hero... -->
        <div class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Cari Game, Diamond, Hero..." />
            </div>
        </div>

        <!-- KATEGORI: Diamond, Hero, dll -->
        <div class="kategori-grid">
            <div class="kategori-item">
                <span class="kategori-emoji">💎</span>
                <span class="kategori-label">Diamond</span>
            </div>
            <div class="kategori-item">
                <span class="kategori-emoji">🦸</span>
                <span class="kategori-label">Hero</span>
            </div>
            <div class="kategori-item">
                <span class="kategori-emoji">🎮</span>
                <span class="kategori-label">Game</span>
            </div>
            <div class="kategori-item">
                <span class="kategori-emoji">🛒</span>
                <span class="kategori-label">Top up</span>
            </div>
        </div>

        <!-- GAME POPULER -->
        <div class="section-title">
            <h3>🔥 Populer</h3>
            <a href="#">Lihat semua</a>
        </div>

        <div class="game-grid">
            <div class="game-item">
                <span class="game-icon">⚔️</span>
                <span class="game-name">MLBB <small>Diamond</small></span>
            </div>
            <div class="game-item">
                <span class="game-icon">🏹</span>
                <span class="game-name">Genshin <small>Genesis</small></span>
            </div>
            <div class="game-item">
                <span class="game-icon">👾</span>
                <span class="game-name">Valorant <small>VP</small></span>
            </div>
            <div class="game-item">
                <span class="game-icon">🧙</span>
                <span class="game-name">Ragnarok <small>Zenny</small></span>
            </div>
            <div class="game-item">
                <span class="game-icon">🐉</span>
                <span class="game-name">PUBG <small>UC</small></span>
            </div>
            <div class="game-item">
                <span class="game-icon">🕹️</span>
                <span class="game-name">Free Fire <small>Diamond</small></span>
            </div>
        </div>

        <!-- footer -->
        <div class="footer-note">
            <span>itemku</span> · topup &amp; jual beli akun
        </div>
    </div>
</body>
</html>
