<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>store · Home</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="home-card">
        <!-- HEADER: store + Masuk -->
        <div class="navbar">
            <div class="brand">store</div>
            <div class="btn-masuk">Masuk</div>
        </div>

        <!-- SEARCH -->
        <div class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Cari Game, Diamond, Hero..." />
            </div>
        </div>

        <!-- KATEGORI (4 tombol) -->
        <div class="kategori-grid">
            <div class="kategori-item">💎 Diamond</div>
            <div class="kategori-item">🦸 Hero</div>
            <div class="kategori-item">🎮 Game</div>
            <div class="kategori-item">🛒 Top up</div>
        </div>

        <!-- BAGIAN TENGAH KOSONG (isi sendiri) -->
        <div class="content-center">
            <!-- Kosongkan, isi sesuai keinginan -->
        </div>

        <!-- FOOTER -->
        <div class="footer-note">
            <span>store</span> · topup & jual beli
        </div>
    </div>
</body>
</html>
