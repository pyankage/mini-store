<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Store • Beranda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER UTAMA (diisi oleh JavaScript) -->
  <header class="store-header" id="storeHeader"></header>

  <!-- DAFTAR JUALAN (8 produk) -->
  <main class="product-list-section">
    <h2 class="section-title">Daftar Jualan</h2>
    <div class="product-grid" id="productGrid">
      <!-- 8 kartu produk (hardcode) -->
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/0f172a/ffffff?text=Produk+1');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 1</div>
          <div class="product-price">Rp 100.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/1e293b/ffffff?text=Produk+2');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 2</div>
          <div class="product-price">Rp 150.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/334155/ffffff?text=Produk+3');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 3</div>
          <div class="product-price">Rp 200.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/475569/ffffff?text=Produk+4');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 4</div>
          <div class="product-price">Rp 250.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/0f172a/ffffff?text=Produk+5');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 5</div>
          <div class="product-price">Rp 300.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/1e293b/ffffff?text=Produk+6');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 6</div>
          <div class="product-price">Rp 350.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/334155/ffffff?text=Produk+7');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 7</div>
          <div class="product-price">Rp 400.000</div>
        </div>
      </div>
      <div class="product-card">
        <div class="product-image" style="background-image: url('https://via.placeholder.com/400x225/475569/ffffff?text=Produk+8');"></div>
        <div class="product-info">
          <div class="product-name">Nama Produk 8</div>
          <div class="product-price">Rp 450.000</div>
        </div>
      </div>
    </div>

    <!-- Tombol menuju semua produk -->
    <div class="show-all-wrapper">
      <a href="pages/semua-produk.html" class="show-all-btn">
        Tampilkan Semuanya <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
