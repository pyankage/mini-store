<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Store • Beranda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER STICKY ===== -->
  <header class="store-header">
    <!-- Baris 1: Logo, Search, Auth -->
    <div class="header-top">
      <div class="logo">
        <i class="fa-solid fa-gamepad"></i>
        <span>GAME<span class="logo-highlight">STORE</span></span>
      </div>
      <div class="search-section">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Cari game, akun, item, joki...">
        <button class="search-btn" id="searchBtn"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="auth-buttons">
        <a href="pages/admin/login.html" class="btn-login"><i class="fa-solid fa-user"></i> Masuk</a>
        <a href="#" class="btn-register">Daftar</a>
      </div>
    </div>

    <!-- Baris 2: Navigasi Kategori dengan Dropdown -->
    <nav class="main-nav">
      <button class="nav-link active" data-genre="semua">Semua</button>
      <div class="dropdown">
        <button class="nav-link" data-genre="akun">Akun <i class="fa-solid fa-chevron-down"></i></button>
        <div class="dropdown-content">
          <a href="#" data-sub="mobile-legends">Mobile Legends</a>
          <a href="#" data-sub="free-fire">Free Fire</a>
          <a href="#" data-sub="pubg">PUBG</a>
          <a href="#" data-sub="genshin">Genshin Impact</a>
        </div>
      </div>
      <div class="dropdown">
        <button class="nav-link" data-genre="item">Item <i class="fa-solid fa-chevron-down"></i></button>
        <div class="dropdown-content">
          <a href="#" data-sub="skin">Skin</a>
          <a href="#" data-sub="senjata">Senjata</a>
          <a href="#" data-sub="item-rare">Item Rare</a>
        </div>
      </div>
      <div class="dropdown">
        <button class="nav-link" data-genre="joki">Jasa Joki <i class="fa-solid fa-chevron-down"></i></button>
        <div class="dropdown-content">
          <a href="#" data-sub="rank-push">Rank Push</a>
          <a href="#" data-sub="leveling">Leveling</a>
          <a href="#" data-sub="mabar">Mabar</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Banner Promosi -->
  <div class="banner-section">
    <div class="banner-content">
      <h1>Top Up & Jasa Game Terpercaya</h1>
      <p>Cari akun, item, atau joki favoritmu dengan harga terbaik</p>
      <button class="btn-banner">Lihat Penawaran</button>
    </div>
  </div>

  <!-- Filter Bar -->
  <section class="filter-section">
    <div class="filter-left">
      <span class="filter-label">Urutkan:</span>
      <select id="sortSelect" class="sort-select">
        <option value="rekomendasi">Rekomendasi</option>
        <option value="termurah">Harga Termurah</option>
        <option value="termahal">Harga Termahal</option>
      </select>
    </div>
    <div class="filter-right">
      <span class="filter-label">Tipe:</span>
      <div class="filter-buttons" id="typeFilter">
        <button class="filter-btn active" data-type="semua">Semua</button>
        <button class="filter-btn" data-type="instan">Instan</button>
        <button class="filter-btn" data-type="manual">Manual</button>
      </div>
    </div>
  </section>

  <!-- Daftar Produk -->
  <main class="product-list-section">
    <h2 class="section-title">Produk Populer</h2>
    <div class="product-grid" id="productGrid"></div>
    <div class="show-all-wrapper">
      <a href="pages/semua-produk.html" class="show-all-btn">Tampilkan Semuanya <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
