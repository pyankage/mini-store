<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>store · Home</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="home-card">
        <!-- HEADER: store + Masuk -->
        <div class="navbar">
            <div class="brand">store</div>
            <div class="btn-masuk">Masuk</div>
        </div>

        <!-- SEARCH -->
        <div class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Cari Game, Diamond, Hero..." />
            </div>
        </div>

        <!-- KATEGORI -->
        <div class="kategori-grid">
            <div class="kategori-item">
                <div class="kategori-icon">💎</div>
                <div class="kategori-label">Diamond</div>
            </div>
            <div class="kategori-item">
                <div class="kategori-icon">🦸</div>
                <div class="kategori-label">Hero</div>
            </div>
            <div class="kategori-item">
                <div class="kategori-icon">🎮</div>
                <div class="kategori-label">Game</div>
            </div>
            <div class="kategori-item">
                <div class="kategori-icon">🛒</div>
                <div class="kategori-label">Top up</div>
            </div>
        </div>

        <!-- GAME POPULER -->
        <div class="section-title">
            <h3>🔥 Populer</h3>
            <a href="#">Lihat semua</a>
        </div>

        <div class="game-grid">
            <div class="game-item">
                <div class="game-icon">⚔️</div>
                <div class="game-name">MLBB</div>
                <div class="game-sub">Diamond</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🏹</div>
                <div class="game-name">Genshin</div>
                <div class="game-sub">Genesis</div>
            </div>
            <div class="game-item">
                <div class="game-icon">👾</div>
                <div class="game-name">Valorant</div>
                <div class="game-sub">VP</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🧙</div>
                <div class="game-name">Ragnarok</div>
                <div class="game-sub">Zenny</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🐉</div>
                <div class="game-name">PUBG</div>
                <div class="game-sub">UC</div>
            </div>
            <div class="game-item">
                <div class="game-icon">🕹️</div>
                <div class="game-name">Free Fire</div>
                <div class="game-sub">Diamond</div>
            </div>
        </div>
    </div>
</body>
</html>
