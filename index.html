<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Store • Tampilan Atas</title>
  
  <!-- Font Awesome untuk icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Link ke CSS eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER UTAMA -->
  <header class="store-header">
    
    <!-- BARIS ATAS: [garis3 + STORE] di kiri | MASUK di kanan -->
    <div class="top-bar">
      <!-- Grup kiri: ikon menu + judul STORE -->
      <div class="left-group">
        <!-- Ikon garis tiga (hamburger) -->
        <button class="menu-dots" id="menuDots" aria-label="Menu garis tiga" title="Menu utama">
          <i class="fa-solid fa-bars"></i>
        </button>
        <!-- Teks STORE di samping ikon -->
        <div class="store-title">STORE</div>
      </div>

      <!-- Tombol MASUK di kanan atas -->
      <button class="login-btn" id="loginBtn" title="Masuk ke akun">
        <i class="fa-solid fa-user"></i> MASUK
      </button>
    </div>

    <!-- BAGIAN PENCARIAN (kotak rata) -->
    <div class="search-section">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input 
        type="text" 
        class="search-input" 
        id="searchInput" 
        placeholder="Cari produk, kategori, atau brand..." 
        aria-label="kolom pencarian"
      >
      <button class="search-clear" id="clearBtn" aria-label="hapus pencarian" title="Bersihkan">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="search-btn" id="searchBtn" aria-label="tombol cari">
        <i class="fa-solid fa-arrow-right"></i> <span>Cari</span>
      </button>
    </div>

    <!-- KETERANGAN SINGKAT (sesuai permintaan) -->
    <div class="info-note">
      <i class="fa-solid fa-circle-info"></i> 
      <span>Kiri: <strong>☰ + STORE</strong> • Kanan: <strong>MASUK</strong> • Bawah: <strong>pencarian kotak</strong></span>
    </div>
  </header>

  <!-- PENJELASAN TAMBAHAN -->
  <div class="explanation">
    <p>
      🧩 <strong>Penjelasan tampilan atas:</strong> 
      Ikon garis tiga (<i class="fa-solid fa-bars"></i>) di pojok kiri atas sebagai menu navigasi, 
      tepat di sampingnya ada teks <strong>STORE</strong>. 
      Tombol <strong>MASUK</strong> berada di pojok kanan atas. 
      Di bawahnya ada <strong>kolom pencarian</strong> dengan desain kotak rata.
    </p>
  </div>

  <!-- Link ke JavaScript eksternal -->
  <script src="js/script.js"></script>
</body>
</html>
